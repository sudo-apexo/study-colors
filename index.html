/* Layout: sticky app bar, overview card with a segmented bar, a responsive grid of big color tiles, extended FAB to add, modal bottom sheet to choose a color. */
:root{
  --font:"Monocraft",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --primary:#2E6B3A; --on-primary:#FFFFFF;
  --primary-container:#B3F1B8; --on-primary-container:#00210B;
  --surface:#F8FAF4; --on-surface:#191D17; --on-surface-variant:#424940;
  --surface-variant:#DEE5D8; --outline:#72796F; --outline-variant:#C2C9BD;
  --sc-low:#F2F5EE; --sc:#ECEFE8; --sc-high:#E6E9E3; --sc-highest:#E1E4DD;
  --error:#BA1A1A; --on-error:#FFFFFF; --error-container:#FFDAD6; --on-error-container:#410002;
  --scrim:rgba(0,0,0,.32); --shadow:rgba(0,0,0,.30);
  --ease:cubic-bezier(.2,0,0,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --primary:#98D59E; --on-primary:#00390F;
    --primary-container:#135223; --on-primary-container:#B3F1B8;
    --surface:#11140F; --on-surface:#E1E4DB; --on-surface-variant:#C2C9BD;
    --surface-variant:#424940; --outline:#8C9388; --outline-variant:#424940;
    --sc-low:#191D17; --sc:#1D211B; --sc-high:#272B25; --sc-highest:#323630;
    --error:#FFB4AB; --on-error:#690005; --error-container:#93000A; --on-error-container:#FFDAD6;
    --scrim:rgba(0,0,0,.55); --shadow:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --primary:#98D59E; --on-primary:#00390F;
  --primary-container:#135223; --on-primary-container:#B3F1B8;
  --surface:#11140F; --on-surface:#E1E4DB; --on-surface-variant:#C2C9BD;
  --surface-variant:#424940; --outline:#8C9388; --outline-variant:#424940;
  --sc-low:#191D17; --sc:#1D211B; --sc-high:#272B25; --sc-highest:#323630;
  --error:#FFB4AB; --on-error:#690005; --error-container:#93000A; --on-error-container:#FFDAD6;
  --scrim:rgba(0,0,0,.55); --shadow:rgba(0,0,0,.6);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--surface)}
body{
  margin:0;background:var(--surface);color:var(--on-surface);
  font-family:var(--font);font-size:14px;line-height:1.5;font-weight:400;
  font-synthesis:none;-webkit-font-smoothing:none;
}
h1,h2,p,ul{margin:0;padding:0}
ul{list-style:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

.gutter{
  width:100%;max-width:1000px;margin-inline:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}

/* App bar */
.appbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:var(--surface);border-bottom:1px solid var(--outline-variant);
}
.appbar .gutter{display:flex;align-items:center;gap:12px;height:64px}
.logo{flex:none;display:block}
.appbar h1{font-size:22px;line-height:28px;font-weight:400;flex:1;min-width:0;overflow-wrap:anywhere}
.sync{
  flex:none;font-size:12px;line-height:16px;color:var(--on-surface-variant);
  padding:6px 10px;border-radius:8px;border:1px solid var(--outline-variant);
}

<script>

    returnFocus = document.activeElement;
    scrim.hidden = false; node.hidden = false;
    openNode = node;
    requestAnimationFrame(function(){
      scrim.classList.add("open"); node.classList.add("open");
      (focusEl || node).focus({ preventScroll: true });
    });
  }
  function closeOverlay(){
    if (!openNode) return;
    var n = openNode; openNode = null;
    n.classList.remove("open"); scrim.classList.remove("open");
    disarmDelete();
    setTimeout(function(){
      if (openNode !== n) n.hidden = true;
      if (!openNode) scrim.hidden = true;
    }, reduced ? 0 : 260);
    var back = returnFocus; returnFocus = null;
    var id = activeId;
    if (n === sheet) activeId = null;
    setTimeout(function(){
      var t = id && grid.querySelector('[data-id="' + id + '"]');
      var target = t || (back && document.contains(back) ? back : null);
      if (target) target.focus({ preventScroll: true });
    }, 0);
  }
  document.addEventListener("keydown", function(e){
    if (!openNode) return;
    if (e.key === "Escape"){ e.preventDefault(); closeOverlay(); return; }
    if (e.key === "Tab"){
      var f = openNode.querySelectorAll("button:not([disabled]),input");
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === openNode)){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });
  scrim.addEventListener("click", closeOverlay);

  /* Color sheet */
  function openSheet(id){
    var s = findSubject(id); if (!s) return;
    activeId = id;
    renameInput.value = s.name;
    buildSwatches(s);
    disarmDelete();
    openOverlay(sheet, sheet);
  }
  function buildSwatches(s){
    swatchesEl.textContent = "";
    var none = el("button", "swatch none state");
    none.type = "button"; none.dataset.key = "";
    none.setAttribute("aria-label", "No color"); none.title = "No color";
    none.setAttribute("aria-pressed", s.color ? "false" : "true");
    none.appendChild(icon(s.color ? ICON_CLOSE : ICON_CHECK));
    swatchesEl.appendChild(none);
    COLORS.forEach(function(c){
      var b = el("button", "swatch state");
      b.type = "button"; b.dataset.key = c.k;
      b.style.setProperty("--bg", c.bg); b.style.setProperty("--fg", c.fg);
      b.setAttribute("aria-label", c.n); b.title = c.n;
      var on = s.color === c.k;
      b.setAttribute("aria-pressed", on ? "true" : "false");
      if (on) b.appendChild(icon(ICON_CHECK));
      swatchesEl.appendChild(b);
    });
    var cur = BYKEY[s.color];
    curEl.textContent = "Current: " + (cur ? cur.n : "no color yet");
  }
  swatchesEl.addEventListener("click", function(e){
    var b = e.target.closest(".swatch"); if (!b || !activeId) return;
    var id = activeId;
    var nameNow = renameInput.value;
    if (nameNow.trim()) renameSubject(id, nameNow);
    setColor(id, b.dataset.key);
    closeOverlay();
  });
  renameInput.addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); renameInput.blur(); }
  });
  renameInput.addEventListener("change", function(){
    if (activeId){
      renameSubject(activeId, renameInput.value);
      var s = findSubject(activeId);
      if (s) renameInput.value = s.name;
    }
  });
  $("doneBtn").addEventListener("click", function(){
    if (activeId) renameSubject(activeId, renameInput.value);
    closeOverlay();
  });

  function disarmDelete(){
    clearTimeout(delTimer);
    delBtn.classList.remove("armed");
    delLabel.textContent = "Delete subject";
  }
  delBtn.addEventListener("click", function(){
    if (!activeId) return;
    if (!delBtn.classList.contains("armed")){
      delBtn.classList.add("armed");
      delLabel.textContent = "Tap again to delete";
      delTimer = setTimeout(disarmDelete, 3500);
      return;
    }
    var id = activeId;
    disarmDelete();
    activeId = null;
    removeSubject(id);
    closeOverlay();
  });

  /* Add dialog */
  function openDialog(){
    newName.value = "";
    confirmNew.disabled = true;
    openOverlay(dialog, newName);
  }
  newName.addEventListener("input", function(){ confirmNew.disabled = !newName.value.trim(); });
  newName.addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); submitNew(); }
  });
  function submitNew(){
    if (!newName.value.trim()) return;
    addSubject(newName.value);
    closeOverlay();
  }
  confirmNew.addEventListener("click", submitNew);
  $("cancelNew").addEventListener("click", closeOverlay);
  $("addBtn").addEventListener("click", openDialog);
  $("emptyAdd").addEventListener("click", openDialog);
  $("clearEx").addEventListener("click", clearExamples);

  grid.addEventListener("click", function(e){
    var t = e.target.closest(".tile"); if (!t) return;
    openSheet(t.dataset.id);
  });

  /* ---------- start ---------- */
  render();
  setSync("local");
  connect();
})();
</script>

</body>
</html>
